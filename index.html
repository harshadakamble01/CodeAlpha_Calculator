
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #27313d, #10151e);
    font-family: Arial, sans-serif;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 390px;
    padding: 22px;
    border-radius: 25px;
    background: linear-gradient(145deg, #697681, #17202a);
    border: 3px solid #89949d;
    box-shadow: 0 20px 45px #0009,
                inset 0 2px 5px #ffffff55;
}

h2 {
    text-align: center;
    color: #62e7e7;
    margin: 10px 0 20px;
}

.display {
    width: 100%;
    height: 105px;
    background: #030407;
    color: #62eeee;
    border: 2px solid #89949d;
    border-radius: 15px;
    margin-bottom: 22px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
}

#expression {
    color: #9caeb5;
    font-size: 17px;
    min-height: 23px;
    overflow-wrap: anywhere;
}

#result {
    font-size: 30px;
    overflow-wrap: anywhere;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

button {
    min-width: 0;
    height: 62px;
    border: 1px solid #66717c;
    border-radius: 12px;
    background: linear-gradient(145deg, #202a35, #080c12);
    color: #65e6e6;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 5px 8px #0008,
                inset 0 1px 3px #ffffff30;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #354b59;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.94);
}

.operator {
    color: #ffce83;
}

.special {
    font-size: 15px;
    color: #75e9e9;
}

.equal {
    background: linear-gradient(145deg, #12a9a9, #087575);
    color: white;
}

.clear {
    color: #ff8585;
}

@media(max-width: 350px) {
    .calculator { padding: 12px; }
    .buttons { gap: 6px; }
    button { height: 54px; font-size: 17px; }
}
</style>
</head>

<body>

<div class="calculator">

<h2>Advanced Calculator</h2>

<div class="display">
    <div id="expression"></div>
    <div id="result">0</div>
</div>

<div class="buttons">
    <button class="special" onclick="scientific('sin')">sin</button>
    <button class="special" onclick="scientific('cos')">cos</button>
    <button class="special" onclick="scientific('tan')">tan</button>
    <button class="special" onclick="scientific('log')">log</button>
    <button class="special" onclick="scientific('sqrt')">√</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add(')')">)</button>
    <button class="equal" onclick="calculate()">=</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('(')">(</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="operator" onclick="add('-')">−</button>
    <button class="clear" onclick="backspace()">DEL</button>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button class="operator" onclick="add('/')">÷</button>
    <button class="operator" onclick="add('%')">%</button>
    <button class="operator" onclick="add('+')">+</button>

    <button class="clear" onclick="clearAll()">AC</button>
    <button class="clear" onclick="clearEntry()">CE</button>
    <button class="special" onclick="add('**')">xʸ</button>
    <button class="special" onclick="add('3.141592653589793')">π</button>
    <button class="special" onclick="add('Math.E')">e</button>
</div>
</div>

<script>
let expression = "";

const result = document.getElementById("result");
const expressionDisplay = document.getElementById("expression");

function update() {
    expressionDisplay.textContent = expression;
    result.textContent = expression || "0";
}

function add(value) {
    expression += value;
    update();
}

function clearAll() {
    expression = "";
    result.textContent = "0";
    expressionDisplay.textContent = "";
}

function clearEntry() {
    expression = "";
    update();
}

function backspace() {
    expression = expression.slice(0, -1);
    update();
}

function calculate() {
    try {
        if (!expression) return;

        if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
            throw new Error("Invalid input");
        }

        let answer = Function('"use strict"; return (' + expression + ')')();

        if (!Number.isFinite(answer)) {
            throw new Error("Math error");
        }

        expressionDisplay.textContent = expression + " =";
        result.textContent = Number(answer.toPrecision(12)).toString();
        expression = String(Number(answer.toPrecision(12)));

    } catch (error) {
        result.textContent = "Error";
        expression = "";
    }
}

function scientific(type) {
    try {
        if (!expression) return;

        let number = Number(expression);
        let answer;

        switch(type) {
            case "sin":
                answer = Math.sin(number * Math.PI / 180);
                break;
            case "cos":
                answer = Math.cos(number * Math.PI / 180);
                break;
            case "tan":
                answer = Math.tan(number * Math.PI / 180);
                break;
            case "log":
                answer = Math.log10(number);
                break;
            case "sqrt":
                answer = Math.sqrt(number);
                break;
        }

        if (!Number.isFinite(answer)) {
            throw new Error("Invalid");
        }

        expressionDisplay.textContent = type + "(" + expression + ")";
        result.textContent = Number(answer.toPrecision(12)).toString();
        expression = String(Number(answer.toPrecision(12)));

    } catch(error) {
        result.textContent = "Error";
        expression = "";
    }
}

document.addEventListener("keydown", function(event) {
    const key = event.key;

    if (/^[0-9.+\-*/%()]$/.test(key)) {
        add(key);
    } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
    } else if (key === "Backspace") {
        backspace();
    } else if (key === "Escape") {
        clearAll();
    }
});
</script>

</body>
</html>
